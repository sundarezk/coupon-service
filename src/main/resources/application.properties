spring.application.name=coupon-service
spring.datasource.url=jdbc:mysql://localhost:3306/coupon_db
spring.datasource.username=root
spring.datasource.password=Wipro@123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.port=8092
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
resilience4j.circuitbreaker.instances.couponService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.couponService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.couponService.sliding-window-size=10
resilience4j.circuitbreaker.instances.couponService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.couponService.permitted-number-of-calls-in-half-open-state=3